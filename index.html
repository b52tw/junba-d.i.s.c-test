function res(sc,tips){
 const mx=Math.max(...sc),mn=Math.min(...sc),tops=sc.map((v,i)=>mx-v<.01?i:-1).filter(i=>i>=0),cham=mx-mn<=8;
 const rest=sc.map((v,i)=>[v,i]).filter(x=>!tops.includes(x[1])).sort((a,b)=>b[0]-a[0])[0];
 let h='<div class="card">'+T.map((t,i)=>`<div class="bar"><span>${t.e} ${t.k} ${t.n}</span><div class="tr"><i style="width:${sc[i]/35*100}%;background:${t.c}"></i></div><b>${fmt(sc[i])}</b></div>`).join('')+'<div class="mu">每項分數範圍 5–35，四項合計 80。</div></div>';
 h+=`<div class="card"><h2>${cham?'🦎 變色龍型':tops.map(i=>`${T[i].e} ${T[i].n}型（${T[i].f}）`).join('＋')}</h2>`;
 if(cham)h+=`<p>${CHAM}</p><p class="mu">判定方式：最高分與最低分相差 8 分以內。略偏：${tops.map(i=>T[i].n).join('、')}。</p>`;
 else{h+=tops.map(i=>`<p>${T[i].d}</p>`).join('');if(rest&&mx-rest[0]<=4)h+=`<p class="mu">副型傾向：${T[rest[1]].e} ${T[rest[1]].n}型</p>`}
 if(tips){h+=rel(tops[0])}
 return h+'</div>'}

 const gap=T.map((_,i)=>o[i]-s[i]),k=gap.reduce((m,v,i)=>Math.abs(v)>Math.abs(gap[m])?i:m,0);
 const top=a=>a.indexOf(Math.max(...a));
 let h='<div class="card"><h2>自評與他評分數</h2><table><tr><th></th><th>自評</th><th>他評</th><th>差距</th></tr>'+T.map((t,i)=>`<tr><td>${t.e} ${t.n}</td><td>${fmt(s[i])}</td><td>${fmt(o[i])}</td><td>${gap[i]>0?'+':''}${fmt(gap[i])}</td></tr>`).join('')+`</table><p>${top(s)===top(o)?`自評與他評的主型一致，都是${T[top(s)].n}型。`:`自評主型是${T[top(s)].n}，他人眼中的主型是${T[top(o)].n}，兩者不同。`}落差最大的是${T[k].n}：${gap[k]>0?'別人比你自己更看見這項特質。':'你自認有這項特質，別人較少看到。'}（共 ${st.others.length} 位評價者的平均）</p></div>`;
 {const og=ogAvg();if(og)h+=tbl(st.gs,og,'5 組作答對照（自／他）')}
 h+='<div class="card"><h2>周哈里窗</h2><p class="mu">以該類型分數高於 20 分（四項平均）視為「明顯」，再對照自己與他人是否都看見。</p><div class="j">'+['open','blind','hid','unk'].map(x=>`<div class="jb"><h3>${JO[x][0]}</h3><p>${JO[x][1]}</p>${q[x].join('')||'<span class="mu">無</span>'}<p>${JO[x][2]}</p></div>`).join('')+'</div></div>';

 else if(s==='invite')h=`<h1>第二步：請重要它人評價你</h1><div class='card'><h2>方式一：讓對方掃碼</h2><p>請對方用手機或平板的相機掃描，填完會得到一組 6 個字母的代碼。</p>${qr(rl())}${shareRow(rl(),0,'想請你花 3 分鐘，幫我評價「我給人的印象」：')}</div><div class='card'><h2>輸入對方給你的代碼</h2><p class='mu'>可一次貼上多組，用空白或換行分開。</p><textarea id='cd' rows='3' placeholder='例如 KQMBTH'></textarea><button class='btn' data-a='addcodes'>加入</button><p>${st.msg||''}</p><p>目前已收到 ${st.others.length} 份評價。</p>${wordsCard()}${st.prof.mode>0?`<button class='btn g' data-a='fetch'>收取網路上的評價</button><p class='mu'>別人掃 QR 評完後，分數會自動送到雲端，按這裡收取。</p>`:''}</div><div class='card'><h2>方式二：當面交給對方填</h2><button class='btn g' data-a='inperson'>在這台裝置上讓對方填</button></div>${st.others.length?`<button class='btn' data-a='compare'>看自評與他評比對</button><button class='btn g' data-a='otherres'>只看他人眼中的我</button>`:''}`;
 else h=`<h1>第三步：自評與他評比對</h1>${cmp()}${wordsCard()}${pdfb('下載完整比對報告 PDF')}<button class="btn g" data-a="more">再加一位評價者</button>`;
 if(s==='intro'&&(st.resume||st.hist.length)&&!RATER)h=(st.resume?`<div class='card'><b>你有上次的紀錄</b>（已完成自評${st.others.length?`，已有 ${st.others.length} 份他評`:''}）<br><button class='btn' data-a='resume'>繼續上次進度</button><button class='btn g' data-a='fresh'>從頭開始（清除紀錄）</button></div>`:`<div class='card'><b>這台裝置有 ${st.hist.length} 次測驗紀錄</b>（用來顯示「與上次比較」，只存在這台裝置）<br><button class='btn g' data-a='fresh'>清除紀錄</button></div>`)+h;
 if(!RATER&&BACK[s])h+=`<br><button class='btn g' data-a='back'>← 回上一頁</button>`;
 if(['selfRes','otherRes','cmp'].includes(s))h=`<div class='ph'><b>Junba 維護 DISC 人際風格測驗報告</b>　${st.prof.name?esc(st.prof.name)+'　':''}${new Date().toLocaleDateString('zh-TW')}</div>`+h;
 if(!RATER&&s!=='intro')h+='<br><button class="btn g" data-a="reset">重新開始</button>';
 document.getElementById('app').innerHTML=h;window.scrollTo(0,0);save()}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.g){const g=st[b.dataset.g],r=+b.dataset.r,c=+b.dataset.c,v=+b.dataset.v,y=window.scrollY;if(!open(g,r)){toast('請先完成上一組');return}const wd=g[r].every(x=>x!=null);if(b.dataset.g==='gs'){const nw=Date.now();st.tm=st.tm||[0,0,0,0,0];st.nc=st.nc||[0,0,0,0,0];st.tm[r]+=st.tl?Math.min(nw-st.tl,60000):0;st.nc[r]++;st.tl=nw}
  if(g[r][c]===v)g[r][c]=null;else{for(let k=0;k<4;k++)if(g[r][k]===v)g[r][k]=null;g[r][c]=v}
  render();window.scrollTo(0,y);if(!wd&&g[r].every(x=>x!=null)&&r<4){const el=document.getElementById('row-'+b.dataset.g+'-'+(r+1));if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'center'});toast('第 '+(r+1)+' 組完成，請繼續第 '+(r+2)+' 組')}return}
 const a=b.dataset.a;st.msg='';
 if(a==='cplink'){cp(b.dataset.u);return}
 if(a==='sharelink'){sh({title:'DISC 人際風格測驗',text:b.dataset.t,url:b.dataset.u});return}
 if(a==='dlqr'){qrBlob(+b.dataset.i).then(bl=>{const u=URL.createObjectURL(bl),el=document.createElement('a');el.href=u;el.download='DISC-QR.png';document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}).catch(()=>toast('無法產生圖片'));return}
 if(a==='shareqr'){qrBlob(+b.dataset.i).then(bl=>{const f=new File([bl],'DISC-QR.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f],text:b.dataset.t});toast('此裝置不支援直接分享圖片，請改用「下載 QR 圖片」')}).catch(()=>{});return}
 if(a==='pdf'){window.print();return}
 if(a==='copy'){try{navigator.clipboard.writeText(b.dataset.c).catch(()=>{})}catch(e){}return}
 if(a==='start'){st.s='self';st.tl=Date.now();st.tm=[0,0,0,0,0];st.nc=[0,0,0,0,0]}
 else if(a==='selfdone'){st.self=sum(st.gs);const tm=st.tm||[0,0,0,0,0],nc=st.nc||[0,0,0,0,0];st.tmeta={sec:Math.round(tm.reduce((x,y)=>x+y,0)/1000),rows:tm.map(x=>Math.round(x/1000)),rev:nc.reduce((x,y)=>x+Math.max(0,y-4),0)};const hh=st.hist,e={t:Date.now(),s:st.self.slice(),sec:st.tmeta.sec,rev:st.tmeta.rev};if(hh.length&&hh[hh.length-1].s.join()===e.s.join())hh[hh.length-1]=e;else hh.push(e);if(hh.length>12)hh.shift();st.s='selfRes'}
 else if(a==='toother')st.s='invite';
 else if(a==='otherdone'){st.others.push(sum(st.go));st.og.push(st.go.map(r=>r.slice()));st.s='otherRes'}
 else if(a==='more')st.s='invite';
 else if(a==='compare'){if(st.others.length)st.s='cmp'}
 else if(a==='otherres')st.s='otherRes';
 else if(a==='back'){st.s=BACK[st.s]||st.s;if(st.s==='self')st.tl=Date.now()}
 else if(a==='gohost')st.s='host';
 else if(a==='entercls'){const v=((document.getElementById('cl')||{}).value||'').trim();if(v)st.prof.cls=v;else st.msg='請先輸入課堂代號'}
 else if(a==='chgcls')st.prof.cls='';
 else if(a==='chgopt'){st.opt=false;st.sel=st.prof.mode}
 else if(a==='ok'){const q=i=>(document.getElementById(i)||{}).value||'',m=document.querySelector('input[name=pm]:checked'),mode=m?+m.value:null;if(mode==null)st.msg='請先選一項。';else{st.sel=mode;st.prof={mode,cls:st.prof.cls,name:q('nm').trim(),email:q('em').trim(),phone:q('ph').trim(),line:q('ln').trim()};if((mode===2||(mode===1&&st.prof.name))&&!(document.getElementById('ag')||{}).checked)st.msg='要上傳名字或聯絡資料，請先勾選同意。';else st.opt=true}}
 else if(a==='fetch'){st.msg='讀取中…';render();pull();return}
 else if(a==='hostgo'){hostgo();return}
 else if(a==='send'){const p=st.prof,c=p.mode===2,v=i=>(document.getElementById(i)||{}).value||'';post({type:'self',cls:p.cls,id:st.id,name:p.name,email:c?p.email:'',phone:c?p.phone:'',line:c?p.line:'',score:st.self,rating:v('rt'),note:v('nt')});st.sent=true}
 else if(a==='inperson'||a==='rstart'){st.go=blank();st.s='other'}
 else if(a==='rdone')st.s=QP.has('r')?'rmsg':'rres';
 else if(a==='rsend'){const v=i=>(document.getElementById(i)||{}).value||'';post({type:'other',cls:QP.get('c')||'',id:QP.get('r'),score:sum(st.go),code:enc(st.go),rating:v('rr'),msg:v('wd').slice(0,100)});st.s='rres'}
 else if(a==='addcodes'){const v=document.getElementById('cd').value.split(/[\s,;]+/).filter(Boolean);let ok=0,bad=0,dup=0;v.forEach(c=>{c=c.toUpperCase();const gr=decg(c);if(!gr)bad++;else if(st.codes.includes(c))dup++;else{st.codes.push(c);st.others.push(sum(gr));st.og.push(gr);ok++}});st.msg=`已加入 ${ok} 份`+(bad?`，${bad} 組代碼無效，請檢查是否輸錯`:'')+(dup?`，${dup} 組重複已略過`:'')}
 else if(a==='resume'){st.opt=true;st.s=st.resume;st.resume=''}
 else if(a==='reset'||a==='fresh')st={prof:{mode:0,cls:st.prof.cls,name:'',email:'',phone:'',line:''},id:nid(),sent:false,opt:false,sel:null,words:[],hist:a==='fresh'?[]:st.hist,tmeta:null,tm:null,nc:null,tl:null,hc:'',hres:'',s:'intro',self:null,gs:blank(),go:blank(),others:[],og:[],codes:[],msg:'',link:st.link};
 render()});
document.addEventListener('change',e=>{if(e.target.name==='pm'){const v=e.target.value,s=(i,x)=>{const el=document.getElementById(i);if(el)el.style.display=x?'block':'none'};s('pf',true);s('cf',v==='2');s('cg',v!=='0')}});
load();if(QP.get('c'))st.prof.cls=QP.get('c');if(RATER)st.s='rintro';else if(HOST)st.s='host';render();
